# Sitemap proxying for easyjackets.com
#
# All seven sitemaps are now generated by the Node backend from live Mongo data.
# Two of them (/sitemap.xml and /product-sitemap.xml) are already proxied; the
# other five still resolve to static files that were deleted from the build, so
# without these blocks they will 404 after the next deploy.
#
# Paste into the `server { ... }` block for easyjackets.com, ABOVE the SPA
# `location / { try_files $uri /index.html; }` rule — nginx matches exact
# `location = ` blocks first, but keeping them together is clearer to read.
#
# Reload with:  nginx -t && systemctl reload nginx

location = /sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /page-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/page-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /product-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/product-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /blog-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/blog-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /category-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/category-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /color-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/color-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /material-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/material-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

location = /size-sitemap.xml {
    proxy_pass https://api.easyjackets.com/api/v1/sitemap/size-sitemap.xml;
    proxy_set_header Host api.easyjackets.com;
}

# /sitemap.xsl stays a static file in the storefront build — it is only the
# stylesheet browsers apply when a human opens a sitemap, and it never changes.

# ── Verifying after reload ───────────────────────────────────────────────────
#
#   for f in sitemap page-sitemap product-sitemap blog-sitemap \
#            category-sitemap color-sitemap material-sitemap size-sitemap; do
#     printf "%-22s " "$f"
#     curl -s "https://easyjackets.com/$f.xml" | grep -c "<loc>"
#   done
#
# Expected at time of writing: 7 / 21 / 145 / 19 / 6 / 23 / 8 / 15.
# The counts move on their own as products, blogs, and pages are added —
# that is the point of the change.
