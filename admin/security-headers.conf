# Security headers for every answer (nginx.conf includes this in the server and in each location that
# sets headers of its own, as nginx drops the server's headers there). Same idea in frontend/ and custom-jacket/.
#   no guessing of file types; never shown inside any frame (clickjacking of the admin); the page address
#   never sent to other sites; no camera / microphone / location; no <base> or plugins; HTTPS only
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Content-Security-Policy: scripts from this site's own files only (no inline or outside scripts can run in the
# admin), styles inline as the UI library writes them, images and API calls over HTTPS, never in a frame
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=15552000" always;
