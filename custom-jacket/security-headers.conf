# Security headers for every answer (nginx.conf includes this in the server and in each location that
# sets headers of its own, as nginx drops the server's headers there). Same idea in frontend/ and admin/.
#   no guessing of file types; not shown inside other sites' frames (clickjacking); the page address only
#   to this site; no camera / microphone / location; no <base> or plugins; HTTPS only (through Coolify's proxy)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Content-Security-Policy: scripts from this site's own files only, styles inline (the jacket drawings use them)
# and from Google Fonts, images and API calls over HTTPS (blob: and data: for the drawings and saved views)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: data: blob:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=15552000" always;
