server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html is a copy of the landing page, so "/" opens on the design
    # rather than a directory listing.
    index index.html;

    # Every page name in this export contains spaces, and the pages link to each
    # other by those exact names. Browsers send them percent-encoded; nginx
    # decodes before matching the filesystem, so they resolve as they are.
    location / {
        try_files $uri $uri/ =404;
    }

    # The design's own 404 page, so a mistyped link still looks like the site.
    # Referenced through a space-free copy: nginx splits directive arguments on
    # whitespace, so "/Easy Jackets 404.dc.html" is read as three arguments and
    # the whole config fails to parse — which stops nginx booting at all.
    error_page 404 /404.html;

    # A preview that is being iterated on — the client should always see the
    # newest deploy, never a cached page from the last one.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Images, fonts and the design-system bundle are content-addressed enough
    # for a preview and are the bulk of the 3 MB, so let them cache.
    location ~* \.(png|jpe?g|webp|svg|woff2?|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    # text/html is always gzipped and listing it again only logs a duplicate warning
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
