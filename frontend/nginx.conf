server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off; # no nginx version in answers

    # security headers (security-headers.conf), repeated in every location with headers of its own
    include /etc/nginx/security-headers.conf;

    # Single-page app: every route is rendered by index.html on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that agents and crawlers fetch by name (llms.txt, robots.txt, /.well-known/...): the real
    # file or a plain 404, never index.html. The fallback above would answer a missing one with the
    # app's HTML and a 200, which tools read as a broken file (Lighthouse fails llms.txt and the
    # ai-catalog.json check on it), while a 404 simply means "this site has none".
    location ~* \.txt$ {
        charset utf-8;
        try_files $uri =404;
    }
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy leaves phones on old hashes.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite fingerprints everything under /assets, so it can cache for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1024;
}
