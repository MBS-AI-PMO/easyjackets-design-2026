server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every route is rendered by index.html on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached, or a deploy leaves phones on old hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite fingerprints everything under /assets, so it can cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
