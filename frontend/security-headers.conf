# Security headers for every answer (nginx.conf includes this in the server and in each location that
# sets headers of its own, as nginx drops the server's headers there). Same idea in admin/ and custom-jacket/.
#   no guessing of file types; not shown inside other sites' frames (clickjacking); the page address only
#   to this site; no camera / microphone / location; no <base> or plugins; HTTPS only (through Coolify's proxy)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=15552000" always;
